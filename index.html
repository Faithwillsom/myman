<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valentines Day</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .gradient-background {
      background: linear-gradient(
        180deg,
        rgba(255, 208, 229, 1) 0%,
        rgba(255, 232, 242, 1) 36%,
        rgba(255, 255, 255, 1) 100%
      );
    }

    .bounce2 {
      animation: bounce2 2s ease infinite;
    }

    @keyframes bounce2 {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-20px);
      }
      60% {
        transform: translateY(-10px);
      }
    }
  </style>
</head>

<body class="gradient-background">
  <div class="flex items-center justify-center h-screen">
    <div class="flex flex-col items-center p-4">

      <img
        id="imageDisplay"
        src="./images/pic1.png"
        alt="Cute image"
        class="rounded-md h-[300px]"
        style="object-fit: cover;"
      />

      <h2
        id="valentineQuestion"
        class="text-4xl font-bold italic text-[#bd1e59] my-4"
      >
        Will you be my Valentine?
      </h2>

      <div class="flex gap-4 pt-[20px] items-center" id="responseButtons">
        <button
          id="yesButton"
          class="bounce2 bg-green-500 hover:bg-green-400 text-white text-[20px] font-medium px-4 py-2 rounded-md min-h-12 min-w-[75px]"
        >
          Yes
        </button>

        <button
          id="noButton"
          class="bg-red-500 hover:bg-red-700 text-white text-[20px] font-medium px-4 py-2 rounded-md min-h-12 min-w-[75px]"
        >
          No
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import confetti from "https://cdn.skypack.dev/canvas-confetti";

    const yesButton = document.getElementById("yesButton");
    const noButton = document.getElementById("noButton");
    const imageDisplay = document.getElementById("imageDisplay");
    const valentineQuestion = document.getElementById("valentineQuestion");
    const responseButtons = document.getElementById("responseButtons");

    let noClickCount = 0;
    let buttonHeight = 48;
    let buttonWidth = 80;
    let fontSize = 20;

    const imagePaths = [
      "./images/pic1.png",
      "./images/pic2.png",
      "./images/pic3.png",
      "./images/pic4.png",
      "./images/pic5.png"
    ];

    const noTexts = [
      "No",
      "Are you sure?",
      "Pookie please 🥺",
      "Don't do this to me 💔",
      "Okay fine you win 😭"
    ];

    noButton.addEventListener("click", () => {
      if (noClickCount < imagePaths.length - 1) {
        noClickCount++;

        imageDisplay.src = imagePaths[noClickCount];

        buttonHeight += 35;
        buttonWidth += 35;
        fontSize += 15;

        yesButton.style.height = `${buttonHeight}px`;
        yesButton.style.width = `${buttonWidth}px`;
        yesButton.style.fontSize = `${fontSize}px`;

        noButton.textContent = noTexts[noClickCount];
      }
    });

    yesButton.addEventListener("click", () => {
      imageDisplay.src = "./images/pic5.png";
      valentineQuestion.textContent = "Yayyy!! 💖";
      responseButtons.style.display = "none";
      confetti();
    });
  </script>
</body>
</html>
